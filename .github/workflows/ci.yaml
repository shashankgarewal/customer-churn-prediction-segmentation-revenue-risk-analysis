name: Build and Push to Docker Hub using GitHub Actions

on:
  push:
    branches: [master, main] # trigger only when changes in master branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{secrets.DOCKERHUB_USERNAME}} # Avoids yaml updates if Docker Hub account or username changes
          password: ${{secrets.DOCKERHUB_PAT}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{secrets.GCP_SA_KEY}}

      - name: Deploy Docker Image to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: churn-intelligence-engine
          region: asia-south1
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME}}/${{github.event.repository.name}}:latest
          flags: |
            --port=8501
            --memory=1Gi
            --allow-unauthenticated